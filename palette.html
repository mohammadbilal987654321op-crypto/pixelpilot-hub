
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelPilot | Palette Lab</title>

<style>
:root {
  --bg: #07150e;
  --panel: #10271a;
  --green: #55d66b;
  --light: #a2ed77;
  --text: #e5f5e8;
  --muted: #a1bba6;
  --border: #285239;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  padding: 25px;
  font-family: Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at top, #174328, transparent 50%),
    var(--bg);
}

header {
  max-width: 1050px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  padding: 15px 0 25px;
  border-bottom: 1px solid var(--border);
}

.logo {
  color: var(--light);
  font-size: 23px;
  font-weight: bold;
}

header a {
  color: var(--text);
  text-decoration: none;
}

main {
  max-width: 1050px;
  margin: 55px auto;
}

h1 {
  font-size: clamp(32px, 6vw, 48px);
  margin-bottom: 10px;
}

h1 span {
  color: var(--green);
}

.subtitle {
  color: var(--muted);
  margin-bottom: 30px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 25px;
}

.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
  align-items: end;
}

label {
  display: block;
  color: var(--light);
  font-weight: bold;
  margin-bottom: 8px;
}

input, select {
  width: 100%;
  min-height: 45px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #08190f;
  color: var(--text);
  padding: 10px;
  font: inherit;
}

input[type="color"] {
  padding: 4px;
  cursor: pointer;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 12px 17px;
  background: var(--green);
  color: #07150e;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  filter: brightness(1.15);
  transform: translateY(-2px);
}

.secondary {
  background: #24452e;
  color: var(--text);
  border: 1px solid var(--border);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 20px;
}

.palette {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-top: 20px;
}

.swatch {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #09180f;
}

.swatch-color {
  height: 155px;
  cursor: pointer;
}

.swatch-info {
  padding: 12px 7px;
  text-align: center;
}

.hex {
  font-size: 13px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.swatch-info button {
  margin-top: 8px;
  padding: 7px 10px;
  font-size: 12px;
}

.saved-list {
  display: grid;
  gap: 12px;
  margin-top: 18px;
}

.saved-item {
  padding: 14px;
  border-radius: 10px;
  background: #091b10;
  border: 1px solid var(--border);
}

.saved-colors {
  display: flex;
  height: 35px;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 10px;
}

.saved-colors span {
  flex: 1;
}

.saved-item button {
  margin-top: 10px;
}

.empty {
  color: var(--muted);
  padding: 15px 0;
}

.status {
  min-height: 24px;
  color: var(--light);
  margin-top: 15px;
}

footer {
  max-width: 1050px;
  margin: 60px auto 0;
  text-align: center;
  color: var(--muted);
  padding: 25px;
  border-top: 1px solid var(--border);
}

@media (max-width: 650px) {
  body {
    padding: 15px;
  }

  .palette {
    grid-template-columns: repeat(2, 1fr);
  }

  .swatch-color {
    height: 115px;
  }

  main {
    margin-top: 35px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">PixelPilot Hub</div>
  <a href="index.html">← Back to Home</a>
</header>

<main>
  <h1>Palette <span>Lab</span></h1>
  <p class="subtitle">
    Create beautiful colour combinations for designs,
    websites, pixel art and Minecraft builds.
  </p>

  <section class="panel">
    <h2>Palette Generator</h2>
    <p class="subtitle">Choose your starting colour and palette style.</p>

    <div class="controls">
      <div>
        <label for="baseColor">Starting Colour</label>
        <input type="color" id="baseColor" value="#55d66b">
      </div>

      <div>
        <label for="paletteType">Palette Style</label>
        <select id="paletteType">
          <option value="analogous">Analogous</option>
          <option value="complementary">Complementary</option>
          <option value="triadic">Triadic</option>
          <option value="monochromatic">Monochromatic</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="generateBtn">Generate Palette</button>
      <button class="secondary" id="randomBtn">Randomize</button>
      <button class="secondary" id="copyAllBtn">Copy All HEX Codes</button>
      <button class="secondary" id="saveBtn">Save Palette</button>
    </div>

    <div class="palette" id="palette"></div>
    <p class="status" id="status" aria-live="polite"></p>
  </section>

  <section class="panel">
    <h2>Saved Palettes</h2>
    <p class="subtitle">Your saved palettes stay in this browser.</p>
    <div class="saved-list" id="savedList"></div>
    <button class="secondary" id="clearBtn">Clear Saved Palettes</button>
  </section>
</main>

<footer>
  PixelPilot Hub · Palette Lab
</footer>

<script>
const baseColor = document.getElementById("baseColor");
const paletteType = document.getElementById("paletteType");
const paletteContainer = document.getElementById("palette");
const statusText = document.getElementById("status");
const savedList = document.getElementById("savedList");

let currentPalette = [];

function hexToHsl(hex) {
  let r = parseInt(hex.slice(1, 3), 16) / 255;
  let g = parseInt(hex.slice(3, 5), 16) / 255;
  let b = parseInt(hex.slice(5, 7), 16) / 255;

  let max = Math.max(r, g, b);
  let min = Math.min(r, g, b);
  let h, s;
  let l = (max + min) / 2;

  if (max === min) {
    h = 0;
    s = 0;
  } else {
    let d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);

    switch (max) {
      case r:
        h = (g - b) / d + (g < b ? 6 : 0);
        break;
      case g:
        h = (b - r) / d + 2;
        break;
      default:
        h = (r - g) / d + 4;
    }

    h /= 6;
  }

  return [h * 360, s * 100, l * 100];
}

function hslToHex(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s /= 100;
  l /= 100;

  let c = (1 - Math.abs(2 * l - 1)) * s;
  let x = c * (1 - Math.abs((h / 60) % 2 - 1));
  let m = l - c / 2;
  let r = 0, g = 0, b = 0;

  if (h < 60) [r, g, b] = [c, x, 0];
  else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];

  const toHex = value =>
    Math.round((value + m) * 255)
      .toString(16)
      .padStart(2, "0");

  return "#" + toHex(r) + toHex(g) + toHex(b);
}

function generatePalette() {
  const [h, s, l] = hexToHsl(baseColor.value);
  const type = paletteType.value;

  let colors = [];

  if (type === "analogous") {
    colors = [-40, -20, 0, 20, 40].map(
      shift => hslToHex(h + shift, s, l)
    );
  }

  if (type === "complementary") {
    colors = [
      hslToHex(h, s, l * 0.65),
      hslToHex(h, s, l * 0.85),
      hslToHex(h, s, l),
      hslToHex(h + 180, s, l * 1.1),
      hslToHex(h + 180, s, l * 0.75)
    ];
  }

  if (type === "triadic") {
    colors = [
      hslToHex(h, s, l * 0.75),
      hslToHex(h, s, l),
      hslToHex(h + 120, s, l),
      hslToHex(h + 240, s, l),
      hslToHex(h + 240, s, l * 0.75)
    ];
  }

  if (type === "monochromatic") {
    colors = [25, 40, 55, 70, 85].map(
      lightness => hslToHex(h, s, lightness)
    );
  }

  currentPalette = colors;
  displayPalette();
}

function displayPalette() {
  paletteContainer.innerHTML = "";

  currentPalette.forEach(color => {
    const card = document.createElement("div");
    card.className = "swatch";

    const colorBox = document.createElement("div");
    colorBox.className = "swatch-color";
    colorBox.style.backgroundColor = color;
    colorBox.title = "Click to copy " + color;

    colorBox.addEventListener("click", () => copyText(color));

    const info = document.createElement("div");
    info.className = "swatch-info";

    const hex = document.createElement("div");
    hex.className = "hex";
    hex.textContent = color.toUpperCase();

    const button = document.createElement("button");
    button.className = "secondary";
    button.textContent = "Copy HEX";
    button.addEventListener("click", () => copyText(color));

    info.append(hex, button);
    card.append(colorBox, info);
    paletteContainer.appendChild(card);
  });
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    statusText.textContent = "Copied " + text + "!";
  } catch {
    statusText.textContent =
      "Clipboard access unavailable. Try using a secure browser connection.";
  }
}

function randomize() {
  const randomHex = () =>
    "#" + Math.floor(Math.random() * 16777216)
      .toString(16)
      .padStart(6, "0");

  baseColor.value = randomHex();
  generatePalette();
  statusText.textContent = "Random palette generated!";
}

function copyAll() {
  if (!currentPalette.length) return;
  copyText(currentPalette.join(", "));
}

function getSavedPalettes() {
  try {
    return JSON.parse(
      localStorage.getItem("pixelpilot_palettes") || "[]"
    );
  } catch {
    return [];
  }
}

function savePalette() {
  if (!currentPalette.length) return;

  const saved = getSavedPalettes();

  saved.unshift({
    id: Date.now(),
    colors: [...currentPalette],
    date: new Date().toLocaleDateString()
  });

  localStorage.setItem(
    "pixelpilot_palettes",
    JSON.stringify(saved.slice(0, 30))
  );

  renderSaved();
  statusText.textContent = "Palette saved!";
}

function renderSaved() {
  const saved = getSavedPalettes();
  savedList.innerHTML = "";

  if (saved.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "No saved palettes yet.";
    savedList.appendChild(empty);
    return;
  }

  saved.forEach(item => {
    const card = document.createElement("div");
    card.className = "saved-item";

    const colors = document.createElement("div");
    colors.className = "saved-colors";

    item.colors.forEach(color => {
      const block = document.createElement("span");
      block.style.backgroundColor = color;
      colors.appendChild(block);
    });

    const details = document.createElement("p");
    details.textContent =
      item.colors.join(" · ") + " | " + item.date;

    const loadButton = document.createElement("button");
    loadButton.className = "secondary";
    loadButton.textContent = "Load Palette";
    loadButton.addEventListener("click", () => {
      currentPalette = [...item.colors];
      baseColor.value = item.colors[0];
      displayPalette();
      statusText.textContent = "Palette loaded!";
    });

    const deleteButton = document.createElement("button");
    deleteButton.className = "secondary";
    deleteButton.textContent = "Delete";
    deleteButton.style.marginLeft = "8px";
    deleteButton.addEventListener("click", () => {
      const updated = getSavedPalettes().filter(
        palette => palette.id !== item.id
      );

      localStorage.setItem(
        "pixelpilot_palettes",
        JSON.stringify(updated)
      );

      renderSaved();
    });

    card.append(colors, details, loadButton, deleteButton);
    savedList.appendChild(card);
  });
}

document.getElementById("generateBtn")
  .addEventListener("click", generatePalette);

document.getElementById("randomBtn")
  .addEventListener("click", randomize);

document.getElementById("copyAllBtn")
  .addEventListener("click", copyAll);

document.getElementById("saveBtn")
  .addEventListener("click", savePalette);

document.getElementById("clearBtn")
  .addEventListener("click", () => {
    if (!confirm("Delete all saved palettes?")) return;

    localStorage.removeItem("pixelpilot_palettes");
    renderSaved();
    statusText.textContent = "Saved palettes cleared.";
  });

generatePalette();
renderSaved();
</script>

</body>
</html>
